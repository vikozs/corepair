[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corepair"
version = "0.1.0"
description = "Measure real Kubernetes/OpenShift demand and turn it into a defensible subscription count"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["openshift", "kubernetes", "finops", "licensing", "capacity-planning", "rightsizing"]
authors = [{ name = "Vid Kosir" }]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://corepair.kosir.info"
Source = "https://github.com/vikozs/corepair"
Issues = "https://github.com/vikozs/corepair/issues"
Changelog = "https://github.com/vikozs/corepair/releases"

[project.scripts]
corepair = "corepair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]