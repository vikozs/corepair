name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: pricing example must refuse to load
        run: |
          python - <<'PY'
          from corepair.config import load_pricing
          try:
              load_pricing("examples/pricing.example.yaml")
          except ValueError:
              print("placeholder guard works"); raise SystemExit(0)
          raise SystemExit("placeholder guard did not fire")
          PY
